name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never uses the production database. Builds and end-to-end tests use
# the staging project when the repository variables STAGING_SUPABASE_URL and
# STAGING_SUPABASE_PUBLISHABLE_KEY are set, and otherwise an address that
# does not exist (public pages still render; signed-in journeys are skipped).
# The E2E_* test accounts must be staging accounts.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit and database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - name: Database tests of the version in production, against every migration
        # The deployed application's own database tests must keep passing
        # after new migrations are applied (backward compatibility).
        env:
          PRODUCTION_APP_COMMIT: 678a8908448738eee40aad9e1067cfffb0811856
        run: |
          git show "$PRODUCTION_APP_COMMIT:supabase/tests/database.test.ts" > supabase/tests/production-app.test.ts
          npx vitest run supabase/tests/production-app.test.ts
          rm supabase/tests/production-app.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_offline' }}

  migration-runner:
    name: Migration runner self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/selftest/db-migrate.selftest.sh
        env:
          SELFTEST_ADMIN_URL: postgresql://postgres@127.0.0.1:54322/postgres

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_offline' }}
      # Optional: set E2E_BASE_URL (repository variable) to test a deployed staging site instead of a local build.
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      # Optional: dedicated staging test accounts (repository secrets). Their journeys are skipped when absent.
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
